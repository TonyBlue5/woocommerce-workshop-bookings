name: Build signed verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and syntax
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -F "Version: ${TAG#v}" woocommerce-workshop-bookings.php
          grep -F "define( 'KWB_VERSION', '${TAG#v}' )" woocommerce-workshop-bookings.php
          grep -F "const VERSION='${TAG#v}'" includes/class-kwb-updater.php
          php -l woocommerce-workshop-bookings.php
          php -l includes/class-kwb-booking.php
          php -l includes/class-kwb-updater.php
          php -l includes/class-kwb-rsvp.php
          php -l includes/class-kwb-settings.php
          php -l includes/class-kwb-i18n.php
          php -l includes/class-kwb-commercial.php
          php -l includes/class-kwb-rewards.php
          php -l includes/class-kwb-campaigns.php
          php -l includes/class-kwb-dashboard.php
      - name: Security preflight
        run: |
          set -euo pipefail
          if grep -REn --include='*.php' -E '(eval|shell_exec|system|passthru|proc_open|popen|pcntl_exec)[[:space:]]*[(]' .; then exit 1; fi
          grep -F "openssl_verify" includes/class-kwb-updater.php
          grep -F "const PUBLIC_KEY" includes/class-kwb-updater.php
          test -s release-public.pem
      - name: Require signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.KWB_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/kwb-release-private.pem
          openssl pkey -in /tmp/kwb-release-private.pem -check -noout
      - name: Build product family ZIPs
        run: |
          set -euo pipefail
          node tools/build.cjs
          unzip -tq build/workshop-bookings-pro-for-woocommerce.zip
      - name: Sign and verify release
        run: |
          set -euo pipefail
          openssl dgst -sha256 -sign /tmp/kwb-release-private.pem -out build/workshop-bookings-pro-for-woocommerce.zip.sig build/workshop-bookings-pro-for-woocommerce.zip
          openssl dgst -sha256 -verify release-public.pem -signature build/workshop-bookings-pro-for-woocommerce.zip.sig build/workshop-bookings-pro-for-woocommerce.zip
          rm -f /tmp/kwb-release-private.pem
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" build/workshop-bookings-pro-for-woocommerce.zip build/workshop-bookings-pro-for-woocommerce.zip.sha256 build/workshop-bookings-pro-for-woocommerce.zip.sig --generate-notes --title "Workshop Bookings Pro for WooCommerce ${TAG#v}"
