name: Build signed verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate version and syntax
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          php -l kangiroo-workshop-bookings.php
          grep -F "Version: ${TAG#v}" kangiroo-workshop-bookings.php
          grep -F "const VERSION      = '${TAG#v}'" kangiroo-workshop-bookings.php
          grep -F "const VERSION = '${TAG#v}'" kangiroo-workshop-bookings.php

      - name: Security preflight
        shell: bash
        run: |
          set -euo pipefail
          if grep -En --include='*.php' '\\b(eval|shell_exec|system|passthru|proc_open|popen|pcntl_exec)\\s*\\(' .; then
            echo "High-risk PHP primitive found."
            exit 1
          fi
          grep -F "openssl_verify" kangiroo-workshop-bookings.php
          grep -F "hash_equals( \\$release['sha256'], \\$actual )" kangiroo-workshop-bookings.php
          grep -F "KWB_RELEASE_PUBLIC_KEY" kangiroo-workshop-bookings.php
          php -l kangiroo-workshop-bookings.php

      - name: Require signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/kwb-release-private.pem
          openssl pkey -in /tmp/kwb-release-private.pem -check -noout

      - name: Build plugin ZIP
        run: |
          set -euo pipefail
          mkdir -p build/kangiroo-workshop-bookings
          cp kangiroo-workshop-bookings.php readme.txt LICENSE build/kangiroo-workshop-bookings/
          cd build
          zip -qr kangiroo-workshop-bookings.zip kangiroo-workshop-bookings
          unzip -tq kangiroo-workshop-bookings.zip
          sha256sum kangiroo-workshop-bookings.zip > kangiroo-workshop-bookings.zip.sha256

      - name: Sign exact release archive
        run: |
          set -euo pipefail
          openssl dgst -sha256             -sign /tmp/kwb-release-private.pem             -out build/kangiroo-workshop-bookings.zip.sig             build/kangiroo-workshop-bookings.zip
          test -s build/kangiroo-workshop-bookings.zip.sig
          rm -f /tmp/kwb-release-private.pem

      - name: Verify signature before publishing
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUBLIC_KEY"
          printf '%s' "$RELEASE_PUBLIC_KEY" > /tmp/kwb-release-public.pem
          openssl pkey -pubin -in /tmp/kwb-release-public.pem -noout
          openssl dgst -sha256             -verify /tmp/kwb-release-public.pem             -signature build/kangiroo-workshop-bookings.zip.sig             build/kangiroo-workshop-bookings.zip
          rm -f /tmp/kwb-release-public.pem

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG"             build/kangiroo-workshop-bookings.zip             build/kangiroo-workshop-bookings.zip.sha256             build/kangiroo-workshop-bookings.zip.sig             --generate-notes             --title "Kangiroo Workshop Bookings ${TAG#v}"
