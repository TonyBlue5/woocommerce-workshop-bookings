name: Security gate

on:
  push:
    branches: [main, recurring-monthly-bookings-v0.3.0]
  pull_request:
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l kangiroo-workshop-bookings.php
          php -l includes/class-kwb-booking.php
          php -l includes/class-kwb-updater.php
      - name: Reject high-risk PHP execution primitives
        run: |
          set -euo pipefail
          if grep -REn --include='*.php' -E '(eval|shell_exec|system|passthru|proc_open|popen|pcntl_exec)[[:space:]]*[(]' .; then
            echo "High-risk PHP primitive found."
            exit 1
          fi
      - name: Verify security invariants
        run: |
          set -euo pipefail
          grep -F "wp_verify_nonce" includes/class-kwb-booking.php
          grep -F "hash_hmac('sha256'" includes/class-kwb-booking.php
          grep -F "hash_equals(self::sig" includes/class-kwb-booking.php
          grep -F "openssl_verify" includes/class-kwb-updater.php
          grep -F "hash_equals(\$r['sha256'],\$actual)" includes/class-kwb-updater.php
          grep -F "const PUBLIC_KEY" includes/class-kwb-updater.php
          test -s release-public.pem

  runtime-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
      - name: Install WordPress, WooCommerce and plugin
        run: |
          set -euo pipefail
          mkdir -p /tmp/kwb-security
          wp core download --path=/tmp/kwb-security --force
          wp config create --path=/tmp/kwb-security --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/kwb-security --url=http://localhost --title=KWBSecurity --admin_user=testadmin --admin_password='Strong-Test-Password-2026!' --admin_email=test@example.com --skip-email
          wp plugin install woocommerce --activate --path=/tmp/kwb-security
          mkdir -p /tmp/kwb-security/wp-content/plugins/kangiroo-workshop-bookings/includes
          cp kangiroo-workshop-bookings.php readme.txt /tmp/kwb-security/wp-content/plugins/kangiroo-workshop-bookings/
          cp includes/*.php /tmp/kwb-security/wp-content/plugins/kangiroo-workshop-bookings/includes/
          wp plugin activate kangiroo-workshop-bookings --path=/tmp/kwb-security
      - name: Run recurring booking security regression tests
        run: wp eval-file "$GITHUB_WORKSPACE/tests/security-smoke.php" --path=/tmp/kwb-security | grep security-smoke-ok
