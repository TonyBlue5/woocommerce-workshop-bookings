name: WordPress + WooCommerce compatibility

on:
  push:
    branches: [main, commercial-dashboard-v0.7.0]
  pull_request:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
        storage: ['legacy', 'hpos']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
      - name: Verify WP-CLI and recover a failed tool download
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null; then
            curl --fail --location --retry 5 --retry-all-errors https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
            sudo install -m 755 /tmp/wp-cli.phar /usr/local/bin/wp
          fi
          wp --info
      - name: PHP syntax check
        run: |
          php -l woocommerce-workshop-bookings.php
          php -l includes/class-kwb-booking.php
          php -l includes/class-kwb-updater.php
          php -l includes/class-kwb-rsvp.php
          php -l includes/class-kwb-settings.php
          php -l includes/class-kwb-i18n.php
          php -l includes/class-kwb-commercial.php
          php -l includes/class-kwb-rewards.php
          php -l includes/class-kwb-campaigns.php
          php -l includes/class-kwb-dashboard.php
      - name: Install latest WordPress and WooCommerce
        run: |
          set -euo pipefail
          mkdir -p /tmp/kwb-test
          wp core download --path=/tmp/kwb-test --force
          wp config create --path=/tmp/kwb-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/kwb-test --url=http://localhost --title=KWBTest --admin_user=testadmin --admin_password='Strong-Test-Password-2026!' --admin_email=test@example.com --skip-email
          wp plugin install woocommerce --activate --path=/tmp/kwb-test
          mkdir -p /tmp/kwb-test/wp-content/plugins/woocommerce-workshop-bookings/includes /tmp/kwb-test/wp-content/plugins/woocommerce-workshop-bookings/assets
          cp woocommerce-workshop-bookings.php readme.txt /tmp/kwb-test/wp-content/plugins/woocommerce-workshop-bookings/
          cp includes/*.php /tmp/kwb-test/wp-content/plugins/woocommerce-workshop-bookings/includes/
          cp assets/* /tmp/kwb-test/wp-content/plugins/woocommerce-workshop-bookings/assets/
          wp plugin activate woocommerce-workshop-bookings --path=/tmp/kwb-test
      - name: Verify integration
        run: |
          wp plugin status woocommerce --path=/tmp/kwb-test
          wp plugin status woocommerce-workshop-bookings --path=/tmp/kwb-test
          wp eval "echo class_exists('KWB_Booking') ? 'booking-loaded' : 'missing';" --path=/tmp/kwb-test | grep booking-loaded
          wp eval "echo class_exists('KWB_GitHub_Updater') ? 'updater-loaded' : 'missing';" --path=/tmp/kwb-test | grep updater-loaded
          wp eval "echo class_exists('KWB_RSVP') ? 'rsvp-loaded' : 'missing';" --path=/tmp/kwb-test | grep rsvp-loaded
          wp eval "echo class_exists('KWB_Settings') ? 'settings-loaded' : 'missing';" --path=/tmp/kwb-test | grep settings-loaded
          wp eval "echo class_exists('KWB_I18n') ? 'i18n-loaded' : 'missing';" --path=/tmp/kwb-test | grep i18n-loaded
          wp eval "echo defined('WC_VERSION') ? WC_VERSION : 'missing';" --path=/tmp/kwb-test
      - name: Select order storage and test commercial workflows
        env:
          STORAGE: ${{ matrix.storage }}
        run: |
          set -euo pipefail
          if [ "$STORAGE" = hpos ]; then
            wp option update woocommerce_custom_orders_table_enabled yes --path=/tmp/kwb-test
          else
            wp option update woocommerce_custom_orders_table_enabled no --path=/tmp/kwb-test
          fi
          wp eval-file "$GITHUB_WORKSPACE/tests/commercial-smoke.php" --path=/tmp/kwb-test | grep commercial-smoke-ok
          wp eval-file "$GITHUB_WORKSPACE/tests/staff-calendar.php" --path=/tmp/kwb-test | grep staff-calendar-ok
      - name: Save rendered dashboard previews
        if: matrix.php == '8.2' && matrix.storage == 'legacy'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-previews
          path: ui-preview/*.html
          retention-days: 7
