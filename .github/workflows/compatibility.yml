name: WordPress + WooCommerce compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli

      - name: PHP syntax check
        run: php -l kangiroo-workshop-bookings.php

      - name: Install latest WordPress and WooCommerce
        run: |
          mkdir -p /tmp/kwb-test
          wp core download --path=/tmp/kwb-test --force
          wp config create --path=/tmp/kwb-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/kwb-test --url=http://localhost --title=KWBTest --admin_user=testadmin --admin_password='Strong-Test-Password-2026!' --admin_email=test@example.com --skip-email
          wp plugin install woocommerce --activate --path=/tmp/kwb-test

          mkdir -p /tmp/kwb-test/wp-content/plugins/kangiroo-workshop-bookings
          cp kangiroo-workshop-bookings.php readme.txt /tmp/kwb-test/wp-content/plugins/kangiroo-workshop-bookings/
          wp plugin activate kangiroo-workshop-bookings --path=/tmp/kwb-test

      - name: Verify plugin and WooCommerce load
        run: |
          wp plugin status woocommerce --path=/tmp/kwb-test
          wp plugin status kangiroo-workshop-bookings --path=/tmp/kwb-test
          wp eval "echo class_exists('WooCommerce') ? 'woocommerce-loaded' : 'woocommerce-missing';" --path=/tmp/kwb-test | grep woocommerce-loaded
          wp eval "echo class_exists('Kangiroo_Workshop_Bookings') ? 'kwb-loaded' : 'kwb-missing';" --path=/tmp/kwb-test | grep kwb-loaded
          wp eval "echo defined('WC_VERSION') ? WC_VERSION : 'missing';" --path=/tmp/kwb-test
          wp core version --path=/tmp/kwb-test

      - name: Basic product integration smoke test
        run: |
          wp eval '
            $p = new WC_Product_Simple();
            $p->set_name("KWB CI Workshop");
            $p->set_regular_price("10");
            $id = $p->save();
            update_post_meta($id, "_kwb_enabled", "yes");
            update_post_meta($id, "_kwb_slots", "2030-01-05|11:00|12:00|10");
            $ok = get_post_meta($id, "_kwb_enabled", true) === "yes";
            echo $ok ? "product-integration-ok" : "product-integration-failed";
          ' --path=/tmp/kwb-test | grep product-integration-ok
