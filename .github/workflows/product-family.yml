name: Product family acceptance
on:
  pull_request:
  push:
    branches: [main, commercial-product-family]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, pro]
        storage: [legacy, hpos]
        php: ['7.4', '8.4']
        wordpress: [latest]
        woocommerce: [latest]
        include:
          - edition: lite
            storage: legacy
            php: '7.4'
            wordpress: '6.4'
            woocommerce: '8.0.0'
          - edition: pro
            storage: hpos
            php: '7.4'
            wordpress: '6.4'
            woocommerce: '8.0.0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
      - name: Build actual deliverables
        run: |
          node tools/build.cjs
          find build/staging -name '*.php' -print0 | xargs -0 -n1 php -l
          for zip in build/*.zip; do unzip -tq "$zip"; done
      - name: Install and test packaged edition
        env:
          EDITION: ${{ matrix.edition }}
          STORAGE: ${{ matrix.storage }}
          WP_VERSION: ${{ matrix.wordpress }}
          WC_VERSION: ${{ matrix.woocommerce }}
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null; then
            curl --fail --location --retry 5 --retry-all-errors https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
            sudo install -m 755 /tmp/wp-cli.phar /usr/local/bin/wp
          fi
          mkdir -p /tmp/family
          wp core download --path=/tmp/family --version="$WP_VERSION"
          wp config create --path=/tmp/family --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/family --url=http://localhost --title=FamilyTest --admin_user=admin --admin_password='Only-For-CI-2026!' --admin_email=test@example.org --skip-email
          if [ "$WC_VERSION" = latest ]; then
            wp plugin install woocommerce --activate --path=/tmp/family
          else
            wp plugin install woocommerce --version="$WC_VERSION" --activate --path=/tmp/family
          fi
          slug=workshop-bookings-for-woocommerce
          if [ "$EDITION" = pro ]; then slug=workshop-bookings-pro-for-woocommerce; fi
          wp plugin install "build/$slug.zip" --activate --path=/tmp/family
          if [ "$STORAGE" = hpos ]; then wp option update woocommerce_custom_orders_table_enabled yes --path=/tmp/family; fi
          wp eval-file "$GITHUB_WORKSPACE/tests/family-smoke.php" --path=/tmp/family | grep family-smoke-ok
          wp eval-file "$GITHUB_WORKSPACE/tests/security-smoke.php" --path=/tmp/family | grep security-smoke-ok
          if [ "$EDITION" = pro ]; then wp eval-file "$GITHUB_WORKSPACE/tests/commercial-smoke.php" --path=/tmp/family | grep commercial-smoke-ok; fi
          if [ "$EDITION" = pro ]; then
            KWB_TEST_MODE=prepare wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-referrals.php" --path=/tmp/family
            pids=""
            for i in 1 2 3 4; do
              KWB_TEST_MODE=qualify wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-referrals.php" --path=/tmp/family &
              pids="$pids $!"
            done
            for pid in $pids; do wait "$pid"; done
            KWB_TEST_MODE=assert wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-referrals.php" --path=/tmp/family | grep concurrent-referrals-ok
          fi
          wp core version --path=/tmp/family
          wp plugin get woocommerce --field=version --path=/tmp/family
          KWB_TEST_MODE=prepare wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-capacity.php" --path=/tmp/family
          pids=""
          for i in 0 1; do
            KWB_TEST_MODE=reserve KWB_ORDER_INDEX=$i wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-capacity.php" --path=/tmp/family &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done
          KWB_TEST_MODE=assert wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-capacity.php" --path=/tmp/family | grep concurrent-capacity-ok
          KWB_TEST_MODE=prepare wp eval-file "$GITHUB_WORKSPACE/tests/migration-smoke.php" --path=/tmp/family
          other=workshop-bookings-pro-for-woocommerce
          if [ "$EDITION" = pro ]; then other=workshop-bookings-for-woocommerce; fi
          wp plugin deactivate "$slug" --path=/tmp/family
          wp plugin install "build/$other.zip" --activate --path=/tmp/family
          wp eval-file "$GITHUB_WORKSPACE/tests/migration-smoke.php" --path=/tmp/family | grep migration-smoke-ok
          wp plugin deactivate "$other" --path=/tmp/family
          wp plugin activate "$slug" --path=/tmp/family
          wp eval-file "$GITHUB_WORKSPACE/tests/migration-smoke.php" --path=/tmp/family | grep migration-smoke-ok
          if [ "$EDITION" = pro ]; then
            wp option update home http://127.0.0.1:8099 --path=/tmp/family
            wp option update siteurl http://127.0.0.1:8099 --path=/tmp/family
            KWB_TEST_MODE=prepare wp eval-file "$GITHUB_WORKSPACE/tests/rsvp-fixture.php" --path=/tmp/family
            php -S 127.0.0.1:8099 -t /tmp/family > /tmp/kwb-http.log 2>&1 &
            server=$!
            trap 'kill "$server"' EXIT
            for i in $(seq 1 20); do if curl -s http://127.0.0.1:8099/ >/dev/null; then break; fi; sleep 1; done
            node tests/rsvp-http.cjs get
            KWB_TEST_MODE=after-get wp eval-file "$GITHUB_WORKSPACE/tests/rsvp-fixture.php" --path=/tmp/family | grep rsvp-http-ok
            node tests/rsvp-http.cjs post
            KWB_TEST_MODE=after-post wp eval-file "$GITHUB_WORKSPACE/tests/rsvp-fixture.php" --path=/tmp/family | grep rsvp-http-ok
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'pro' && matrix.storage == 'hpos' && matrix.php == '8.4'
        with:
          name: workshop-bookings-test-packages
          path: |
            build/*.zip
            build/*.sha256
          retention-days: 14
